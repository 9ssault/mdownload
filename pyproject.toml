[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdownload"
version = "0.1.0"
description = "Full-screen TUI media downloader (yt-dlp + Spotify / YouTube Music browsing)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "yt-dlp>=2024.4.9",
    "yt-dlp-ejs>=0.8",
    "spotipy>=2.24",
    "ytmusicapi>=1.5",
]

[project.scripts]
mdownload = "mdownload.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdownload = ["styles.tcss"]
